<v-card class="dashboardcard" elevation="3">
    <div class="dashboard-card-header-divider"></div>
    <v-card-title class="text-h6 font-weight-bold primary--text justify-center py-4">
        <slot name="header"></slot>
    </v-card-title>
    <v-divider></v-divider>
    <v-card-text>
        <v-row>
            <v-col cols="12">
                <slot name="content"></slot>
            </v-col>
        </v-row>
    </v-card-text>
    <v-card-actions v-if="$slots.button" class="justify-center pb-4">
        <slot name="button"></slot>
    </v-card-actions>
</v-card>
